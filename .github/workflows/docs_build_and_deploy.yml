name: Docs

# Adapted from neuroinformatics-unit/movement's docs workflow.
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_sphinx_docs:
    name: Build Sphinx Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . --group docs

      - name: Check links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m sphinx -b linkcheck -W --keep-going docs/source docs/build/linkcheck

      - name: Build documentation
        run: python -m sphinx -b html -W --keep-going docs/source docs/build/html

      - name: Upload documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-build
          path: docs/build/html/
          if-no-files-found: error
          # Preserve Sphinx's .nojekyll file for GitHub Pages.
          include-hidden-files: true

  deploy_sphinx_docs:
    name: Deploy Sphinx Docs
    needs: build_sphinx_docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Pull requests and merge queues only build; forks never publish here.
    if: |
      github.repository == 'neuroinformatics-unit/spikesorted' &&
      ((github.event_name == 'push' && github.ref_type == 'tag') ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    concurrency:
      group: docs-gh-pages
      cancel-in-progress: false
    steps:
      - uses: neuroinformatics-unit/actions/deploy_sphinx_docs@v3
        with:
          secret_input: ${{ secrets.GITHUB_TOKEN }}
          # The artifact already contains HTML at its root, without html/.
          use-make: false
