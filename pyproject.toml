[project]
name = "spikesorted"
authors = [{name = "Joe Ziminski", email= "joseph.j.ziminski@gmail.com"}]
description = "`spikesorted` is an end-to-end spike sorting pipeline"
readme = "README.md"
requires-python = ">=3.11.0"
dynamic = ["version"]

dependencies = [
    "PyYAML",
    "pydantic",
    "typing_extensions",
    "spikeinterface==0.105.3",
    "scipy",
    "pandas",
    "submitit",
]

license = "BSD-3-Clause"

license-files = ["LICENSE"]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]



[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "coverage",
  "tox",
  "mypy",
  "pre-commit",
  "ruff==0.16.10",
  "codespell",
  "check-manifest",
  "setuptools-scm",
]

[dependency-groups]
docs = [
  "linkify-it-py",
  "myst-parser",
  "nbsphinx",
  "pydata-sphinx-theme",
  "setuptools-scm",
  "sphinx",
  "sphinx-autodoc-typehints",
  "sphinx-sitemap",
]

[build-system]
requires = [
    "setuptools>=77",
    "wheel",
    "setuptools-scm[toml]>=8",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["spikesorted*"]
exclude = ["tests", "docs*"]


[tool.pytest.ini_options]
addopts = "--cov=spikesorted"
filterwarnings = [
    "error",
]

[tool.setuptools_scm]
search_parent_directories = true

[tool.check-manifest]
ignore = [
  "*.yaml",
  "tox.ini",
  "tests/",
  "tests/test_unit/",
  "tests/test_integration/",
  "docs/",
  "docs/source/",
]


[tool.ruff]
line-length = 88
extend-exclude = ["__init__.py", "build", ".eggs", ".venv-docs"]
fix = true

[tool.ruff.lint]
# See https://docs.astral.sh/ruff/rules/
ignore = [
  "D203", # one blank line before class
  "D213", # multi-line-summary second line
]
select = [
  "E",      # pycodestyle errors
  "F",      # Pyflakes
  "UP",     # pyupgrade
  "I",      # isort
  "B",      # flake8 bugbear
  "SIM",    # flake8 simplify
  "C90",    # McCabe complexity
  "D",      # pydocstyle
  "NPY201", # checks for syntax that was deprecated in numpy2.0
]
per-file-ignores = { "**/tests/**" = [
  "D100", # missing docstring in public module
  "D205", # missing blank line between summary and description
  "D103", # missing docstring in public function
], "**/examples/**" = [
  "B018", # Found useless expression
  "D103", # Missing docstring in public function
  "D400", # first line should end with a period.
  "D415", # first line should end with a period, question mark...
  "D205", # missing blank line between summary and description
] }

[tool.ruff.format]
docstring-code-format = true # Also format code in docstrings

[tool.tox]
legacy_tox_ini = """
[tox]
requires =
    tox>=4
    tox-gh-actions
envlist = py{311,312,313}
isolated_build = True

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313

[testenv]
passenv =
    CI
    GITHUB_ACTIONS
extras =
    dev
commands =
    pytest -v --color=yes --cov=spikesorted --cov-report=xml
"""


[tool.codespell]
skip = '.git,.tox,.venv-docs'
check-hidden = true
